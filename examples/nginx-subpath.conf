# Serve the app under a sub-path, e.g. https://electerm.xxxx.com/electerm/
#
# Set BASE_PATH=electerm in .env first: the page then emits prefixed asset/api
# urls and the server accepts both the prefixed and the plain paths, so this
# conf works whether or not nginx strips the prefix.
#
# Note the trailing slash on proxy_pass: nginx forwards /electerm/xyz as /xyz.
# Dropping it (proxy_pass http://electerm;) forwards /electerm/xyz unchanged,
# which also works — the server strips the prefix itself.

upstream electerm-sub {
  server 127.0.0.1:5577;
}

server {
  listen 80;
  server_name electerm.xxxx.com;

  location /electerm/ {
    proxy_pass http://electerm-sub/;
    proxy_buffering off;
    proxy_set_header        Host            $host;
    proxy_set_header        X-Real-IP       $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    # websocket (terminals, sftp, rdp, vnc, spice) needs the upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;  # 1 day timeout
    proxy_send_timeout 86400;  # 1 day timeout
  }

  # optional: /electerm -> /electerm/ so the page's relative urls resolve
  location = /electerm {
    return 301 /electerm/;
  }
}
